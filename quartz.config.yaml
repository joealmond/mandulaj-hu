# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
#
# Site config for mandulaj.hu
#
# NOTE: `content/` is GENERATED by `npm run sync` from the Obsidian vault.
# Never edit content/ by hand — it is overwritten on every sync.
# See CLAUDE.md for the architecture, README.md for the publishing workflow.

configuration:
  pageTitle: József Mandula
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  locale: en-US
  baseUrl: mandulaj.hu

  # Defense in depth. The real guarantee is that sync.mjs only ever copies
  # published notes into content/ — the vault is never on this machine's
  # build path. These patterns are the belt to that pair of braces.
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - .trash
    - "**/.git"

  theme:
    # Self-hosted at build time from Google Fonts: no third-party connection
    # at runtime, no render-blocking <link> to fonts.googleapis.com.
    fontOrigin: local
    cdnCaching: false
    typography:
      # Archivo for headings — a grotesque with the squared-off, high-impact
      # weight of Hungarian constructivist print, which is the whole point of
      # this direction; Libre Franklin for body because it shares Franklin
      # Gothic's skeleton (so the page reads as one voice) while staying warm
      # enough for long prose; Space Mono for the note IDs and code, where its
      # slab-ish quirk reads as machined rather than neutral.
      header: Archivo
      body: Libre Franklin
      code: Space Mono
    colors:
      lightMode:
        light: "#F2EFE6" # paper
        lightgray: "#DCD7C9" # rules, borders
        gray: "#6F6857" # meta text — 5.3:1 on paper
        darkgray: "#16130F" # body text — 16.1:1
        dark: "#16130F" # headings
        # `secondary` IS the accent. This is only the fallback: the real value
        # is set per page by _accents.generated.scss on body[data-slug].
        secondary: "#1F3FA8"
        tertiary: "#4A63C4"
        highlight: rgba(31, 63, 168, 0.08)
        textHighlight: "#D2321E33"
      darkMode:
        light: "#16130F"
        lightgray: "#302B23"
        gray: "#9C9382"
        darkgray: "#EDE9DE"
        dark: "#FBFAF7"
        secondary: "#5777E0"
        tertiary: "#8AA3EA"
        highlight: rgba(87, 119, 224, 0.12)
        textHighlight: "#D2321E44"

plugins:
  # ── Transformers ────────────────────────────────────────────────────────
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      # git first: filesystem mtime is meaningless after a sync copy, and
      # meaningless again in Vercel's fresh checkout. Frontmatter wins when
      # explicitly set, git history otherwise.
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  # DISABLED. This injects KaTeX CSS + JS from cdn.jsdelivr.net into EVERY
  # page, whether or not it contains math: ~265ms of render-blocking work and
  # a third-party request on every view, which defeats the point of
  # self-hosting the fonts. No published note currently uses math.
  # Re-enable if you start writing it — the cost is per-page, not per-formula.
  - source: "@quartz-community/latex"
    enabled: false
    options:
      renderEngine: katex
    order: 80
  # ⚠ REQUIRED — DO NOT DISABLE.
  # This is not just the properties *view*: it is the frontmatter PARSER that
  # populates `vfile.data.frontmatter`. With it off, `explicit-publish` reads
  # `undefined`, silently filters out EVERY note, and the site builds empty.
  # `hidePropertiesView: true` keeps the parsing and drops the rendered table,
  # so `publish: true` never appears on the page.
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties: []
      excludedProperties: []
      hidePropertiesView: true
      delimiters: "---"
      language: yaml
    order: 5

  # ── Filters ─────────────────────────────────────────────────────────────
  # THE gate. Without `publish: true` in frontmatter, a note is not built.
  # Default is "not published" — omitting the flag means private.
  - source: "@quartz-community/explicit-publish"
    enabled: true
  # Still honour `draft: true` so a published note can be pulled back
  # without deleting its publish flag.
  - source: "@quartz-community/remove-draft"
    enabled: true

  # ── Emitters ────────────────────────────────────────────────────────────
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
      rssFullHtml: true
      rssLimit: 50
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/favicon"
    enabled: true
  # Options (incl. the custom imageStructure) are set in quartz.ts — a JSX
  # component cannot be expressed in YAML.
  - source: "@quartz-community/og-image"
    enabled: true

  # ── Page types ──────────────────────────────────────────────────────────
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true

  # ── Layout components ───────────────────────────────────────────────────
  - source: ./quartz-custom/plugins/note-header
    enabled: true
    layout:
      position: beforeBody
      priority: 8
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: ./quartz-custom/plugins/pagefind-search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/search"
    enabled: false
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  # The switchable rail: Recent / Categories / Tree. It renders the first two
  # panes and toggles the explorer below via body[data-panel].
  - source: ./quartz-custom/plugins/panel
    enabled: true
    layout:
      position: left
      priority: 40
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  # Desktop only. At phone width the nodes render around 4px and nothing comes
  # close to a 44px touch target, so it is a decoration nobody can operate —
  # for ~180ms of blocking time. Backlinks stay on mobile: they are the actual
  # sideways navigation the graph only illustrates.
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
      display: desktop-only
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: ./quartz-custom/plugins/projects
    enabled: true
    layout:
      position: afterBody
      priority: 10
  - source: ./quartz-custom/plugins/series-nav
    enabled: true
    layout:
      position: afterBody
      priority: 15
  - source: ./quartz-custom/plugins/engagement
    enabled: true
    layout:
      position: afterBody
      priority: 30
  - source: ./quartz-custom/plugins/webmentions
    enabled: true
    layout:
      position: afterBody
      priority: 20
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        RSS: /index.xml
        GitHub: https://github.com/joealmond
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  # Downloads Archivo / Libre Franklin / Space Mono at BUILD time and serves
  # them from our own origin. No runtime request to fonts.googleapis.com, so
  # nothing third-party sits in the critical path.
  #
  # NOTE: this plugin's `fontOrigin` vocabulary differs from the top-level
  # theme one — here "local" means *do not load at all*, "selfHosted" means
  # download and serve. We want selfHosted.
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      fontOrigin: selfHosted
      useThemeFonts: false
      header:
        name: Archivo
        weights: [700, 800]
        includeItalic: false
      body:
        name: Libre Franklin
        weights: [400, 600]
        includeItalic: true
      code:
        name: Space Mono
        weights: [400, 700]
        includeItalic: false

  # ── Explicitly off ──────────────────────────────────────────────────────
  - source: "@quartz-community/comments"
    enabled: false
  - source: "@quartz-community/reader-mode"
    enabled: false
  - source: "@quartz-community/stacked-pages"
    enabled: false
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/citations"
    enabled: false
  # ENABLED to match Obsidian. Obsidian's `strictLineBreaks` is off by default,
  # so a single newline renders as a line break there. Standard Markdown joins
  # those lines into one paragraph instead, which turned a vertical list of
  # links into a run-on sentence. This makes the site render what you see while
  # writing.
  #
  # Consequence: hard-wrapped prose gets a break at every wrap point. Write
  # paragraphs as one long line, as this vault already does.
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
  - source: "@quartz-community/ox-hugo"
    enabled: false
  - source: "@quartz-community/roam"
    enabled: false
  - source: "@quartz-community/tag-list"
    enabled: false
  # CNAME is a GitHub Pages artifact; we deploy to Vercel.
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: false
  - source: "@quartz-community/bases-page"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: false
  - source: "@quartz-community/encrypted-pages"
    enabled: false
  - source: "@quartz-themes/core"
    enabled: false

layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      # The 404 page type hardcodes the `minimal` frame, which renders no rails
      # at all. Overriding it to `default` gives the page the left rail, so a
      # dead link lands on search and the recent-notes list — a way back in,
      # rather than an apology.
      template: default
      # `left` is deliberately NOT emptied.
      positions:
        beforeBody: []
        right: []
    content: {}
    folder:
      positions:
        right: []
    tag:
      positions:
        right: []
